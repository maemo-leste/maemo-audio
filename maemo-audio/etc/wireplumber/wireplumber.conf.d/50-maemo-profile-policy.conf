# Do not remember device profiles.
#
# Profile selection is UCM's job on Maemo/Leste: the verb and the set of
# enabled devices come from the card's UCM2 files, and wireplumber picks
# the best available profile when the card is probed. Persisting a profile
# on top of that defeats jack-driven switching, because the
# device/find-stored-profile hook runs before find-best-profile and a
# stored profile wins outright.
#
# The concrete failure this avoids, seen on droid4:
#
#   1. sphone's route-pulseaudio module calls
#      pa_context_set_card_profile_by_index() when a call ends, to get off
#      the Voice Call verb. With the jack out and the route left on the
#      earpiece there is no "HiFi with earpiece" profile, so its tier-1
#      fallback picks the highest-priority available HiFi profile, which
#      is "HiFi (Mic, Speaker)".
#   2. A client-initiated profile change arrives with save = true, so
#      state-profile.lua's store_user_selected_profile_hook writes it to
#      ~/.local/state/wireplumber/default-profile.
#   3. From then on the card is pinned to "HiFi (Mic, Speaker)". Plugging
#      in headphones no longer switches the profile, because the
#      remembered profile outranks the jack, and the symptom -- headphones
#      in, still playing out of the speaker -- points nowhere near the file
#      responsible.
#
# Verified with this setting in place: a clean start picks the best
# profile, an explicit client set changes it for the running session, and
# neither writes the state file.
#
# device.restore-routes is deliberately left at its default of true. That
# is where per-port sink volume lives -- default-routes stores
# channelVolumes as linear amplitude -- and the volume applet's tuning
# ladders depend on the level the user left surviving a restart.

wireplumber.settings = {
  device.restore-profile = false
}
