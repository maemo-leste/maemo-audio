# Use RTKit instead of the XDG desktop portal for realtime scheduling.
#
# The same reason as pipewire.conf.d/20-rt.conf: the portal's Realtime
# backend cannot read this kernel's pid namespaces, and because it owns
# org.freedesktop.portal.Desktop, module-rt prefers it and never falls
# through to RTKit. Without this WirePlumber's data loop stays
# SCHED_OTHER -- and on this stack the Bluetooth sink lives in
# WirePlumber's process, so that is the thread driving the headset.

context.modules = [
  { name = libpipewire-module-rt
    args = {
      rtportal.enabled = false
    }
  }
]
