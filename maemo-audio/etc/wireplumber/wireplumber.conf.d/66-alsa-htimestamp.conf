# Hardware timestamps, on for every ALSA PCM.
#
# Without them the driver reports its playback position from the period
# interrupt, which is a whole period coarse, and every arrival stamp
# built on that position inherits the coarseness. The codec move is
# timed against those stamps, so on a USB card the lift arrived early
# often enough to put a +7 dB bump on the attack in one run in seven;
# with timestamps the same seven runs all landed within 0.2 dB.
#
# Deliberately not matched on the bus: which device a machine exposes is
# an accident of the hardware, and a rule that names one goes silent the
# moment the hardware changes. Trust is not the reason to hold back
# either. The driver counts timestamp inconsistencies and turns
# htimestamp off by itself once they exceed
# api.alsa.htimestamp.max-errors, so a card whose timestamps lie
# withdraws this on its own instead of being believed indefinitely.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
      { node.name = "~alsa_input.*"  }
    ]
    actions = {
      update-props = {
        api.alsa.htimestamp = true
      }
    }
  }
]
