# Maemo volume policy
#
# The volume applet publishes the user's intent as
#
#     x-maemo.volume.target = <integer step>   (subject = sink node id)
#
# in the default metadata namespace.  This script turns that into a
# volume on the card's active route, which is where a sink's level
# actually lives: pipewire-pulse reads it back out of the route, so
# pactl and every other PulseAudio client see the truth, and
# state-routes.lua stores it per port, so headphones and speakers keep
# their own levels across a restart.
#
# A stream may also carry
#
#     x-maemo.volume.absolute = 1
#
# meaning its own volume is the level it wants to be heard at, wherever
# the slider sits.  The output goes to the loudest such stream and every
# stream is pulled back by the difference.  That is what keeps a wake-up
# alarm from being muted by a low slider without ever touching the
# slider itself.
#
# Nothing here names an application.  See the script header for the
# arithmetic.

wireplumber.components = [
  {
    name = policy/maemo-volume.lua,
    type = script/lua
  }
]

# Honouring an absolute claim means rewriting that stream's channel
# volumes, and the value written is a compensation, not something the
# application asked to have remembered.  Left alone it would be stored
# against the application name and restored onto the next stream from the
# same application, which would make every later click quieter than the
# last.  state-stream.lua applies these rules to the stream properties
# before it consults state.restore-props on both the restore and the
# store path, so the opt-out belongs here rather than in every client.
#
# Ordinary streams are not matched, so per-application volume such as
# VLC's keeps persisting untouched.
#
# Note the ~ : rule values are not globs.  A bare "*" is matched
# literally; "~" starts a regex.
stream.rules = [
  {
    matches = [ { "x-maemo.volume.absolute" = "~.+" } ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]

# No other settings are needed.  The policy compensates ordinary streams
# through the master volume, a scalar no PulseAudio client writes, so
# their persistence stays on and what the user set in an application such
# as VLC is still remembered.  A stale master left by a stream that died
# mid-compensation is corrected on the next recompute, because the policy
# sets the master on every stream it manages.
