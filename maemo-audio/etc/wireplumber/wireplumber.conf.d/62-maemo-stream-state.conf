# Stream state and the notification role
#
# Absolute streams carry the user's level as their own stream volume while
# the codec sits at the ceiling. That volume is a carrier, not a preference,
# and it is worth exactly the moment it was played in.
#
# WirePlumber keys stored stream properties by media.role, and every event
# sound on the device shares the role that libcanberra defaults to ("event",
# which the pulse protocol renames Notification). So one click would freeze
# its carrier level into the shared bucket, and the next stream of that role
# would have it written back at creation, abs ones included.
#
# The role has no user-settled volume to remember on this device: notification
# loudness follows the media slider. So there is nothing to lose by not
# restoring it, and a great deal to lose by doing so.

stream.rules = [
  {
    matches = [
      { media.role = "Notification" }
    ]
    actions = {
      update-props = {
        state.restore-props = "false"
      }
    }
  }
]
