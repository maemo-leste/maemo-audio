# Use oFono for HFP/HSP, the call profile, on Bluetooth headsets.
#
# oFono is part of telephony and is always running, and it registers the
# Handsfree profile with BlueZ itself. PipeWire's native backend then
# cannot register its own:
#
#   sco_listen: listen(): Address already in use
#   RegisterProfile() failed: org.bluez.Error.NotPermitted
#   ofono running, but not configured as HFP/HSP backend: it may interfere
#
# and what the user sees is that a headset offers no head-unit profile at
# all, only the A2DP ones, so there is nothing to switch to when a call
# arrives, and the failure is silent because A2DP keeps working fine.
#
# Naming oFono as the backend stops the native backend from trying to own
# the same profile. A2DP is unaffected either way, that stays with the
# native backend; this only decides who handles SCO.

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "ofono"
}
