# Maemo routing
#
# WirePlumber's only job in the volume design: tell the daemon where the
# audio goes. Which device, which card profile device, which route index,
# and which sink is the default.
#
# That is genuinely its domain. Several card routes can be available at
# once and only the policy knows which one was selected; nothing in the
# daemon can derive it.
#
# It decides nothing about loudness. The level has to be agreed in the
# same process as the route write and the node the applet reads the level
# back from, so it lives in libpipewire-module-maemo-mix and the mixer it
# drives. This file used to compute it, which meant every decision was
# made against a view of the graph that was already stale by the time the
# write landed.
#
#   maemo-routing.lua          where the audio goes        (this)
#   module-maemo-mix           how loud                    (in-process)

wireplumber.components = [
  {
    name = policy/maemo-routing.lua,
    type = script/lua
  }
]
