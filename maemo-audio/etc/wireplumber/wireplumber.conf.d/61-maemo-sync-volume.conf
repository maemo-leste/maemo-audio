# Which outputs have a hardware gain stage that can be timed against the
# audio, and which do not.
#
# This is PipeWire's version of PulseAudio's PA_SINK_SYNC_VOLUME, and it is
# meant to be read the same way: the capability is advertised, and where it
# is not, the core makes no attempt to schedule the hardware against the
# samples. Nokia's code is explicit that a sink without the flag is written
# straight from the main loop and nothing is queued for it -- the queue
# exists to serve the timing, and where there is no timing there is nothing
# for it to do.
#
# An ALSA output qualifies: its route volume is a codec register, and the
# distance to it is reported on the graph clock, so a change can be aimed at
# the samples that need it. A Bluetooth output does not: its route volume
# becomes an AVRCP command, whose latency is a D-Bus call, an over-the-air
# transaction and whatever the device decides to do with it. Measured here,
# 26 to 40 ms from our write until BlueZ reports the transport updated, on
# top of our own ~23 ms, and no observable that says when the headset
# actually applies it.
#
# Absent means not synchronisable, which is also PulseAudio's default.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.sync = "true"
      }
    }
  }
]

# Margins are per output as well, for the same reason the ladder is: what a
# release has to wait out is that device's buffer and its control path. A
# Bluetooth sink's declared transport distance underestimates how long its
# audio stays audible, so the release trails it; an ALSA codec whose delay
# is measured rather than declared needs nothing, and declares nothing.
# Note the monitor: rules are per monitor, and a bluez_output node is not
# created by the ALSA one. Putting this under monitor.alsa.rules matches
# nothing at all, silently.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.raise-margin-usec = "-30000"
        x-maemo.volume.lower-margin-usec = "-30000"
      }
    }
  }
]
