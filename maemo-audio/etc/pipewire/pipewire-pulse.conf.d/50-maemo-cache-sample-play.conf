# Keep the playback stream of short event sounds around after it drains so
# the next play does not pay for node export and negotiation.  Add other
# sample playback clients here.
#
# This is the userside half of a patch to module-protocol-pulse, which
# defines pulse.cache-stream and pulse.cache-stream-max (sample-play.c,
# pending-sample.c). Against a stock libpipewire the property is simply
# unknown and the rule does nothing, so this file is inert rather than
# wrong there -- but it is what turns the patch on, and deleting it would
# leave the patch with no way to be asked.
#
# The win is ordinary and does not depend on anything else in this
# package: a keypress click is a few milliseconds of audio, and paying
# node export and format negotiation for each one is most of the work.

pulse.rules = [
    {
        matches = [
            { application.process.binary = "maemo-xinput-sounds" }
        ]
        actions = {
            update-props = {
                pulse.cache-stream = true,
                # A cached sample stream is written when the client asks, not
                # when the graph pulls, so it cannot tolerate being asked for
                # more than the consumer has taken. Reliable transport makes
                # the core hold the producer instead of overwriting a buffer
                # the mixer has not read; without it a quantum of the click is
                # silently dropped when the mixer is a cycle behind.
                node.reliable = true
            }
        }
    }
]
