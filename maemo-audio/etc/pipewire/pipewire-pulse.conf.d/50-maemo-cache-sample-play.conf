# Keep the playback stream of short event sounds around after it drains so
# the next play does not pay for node export and negotiation.  Add other
# sample playback clients here.

pulse.rules = [
    {
        matches = [
            { application.process.binary = "maemo-xinput-sounds" }
        ]
        actions = {
            update-props = {
                pulse.cache-stream = true
            }
        }
    }
]
