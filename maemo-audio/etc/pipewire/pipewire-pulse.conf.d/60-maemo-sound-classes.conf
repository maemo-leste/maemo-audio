# Streams whose level is a settled level rather than a fraction of the slider.
#
# The claim is normally the client's to make, and nsv and the input sounds do
# put x-maemo.volume.absolute on their own streams. This is for the consumers
# that cannot. A canberra caller hands over a media name and nothing else, and
# hildon-desktop, libhildon and rtcom hand over a stream restore id and no
# level at all, so the class has to be recognised here instead of in every
# package that plays a sound.
#
# The window sounds and dialog sounds take their level from the volume stored
# for the x-maemo-system-sound role, which nsv publishes from the profile, so
# the restore id has to become the role before that store can be consulted,
# WirePlumber keys its stored stream levels on media.role and has never heard
# of the restore id.
#
# stream.rules and not pulse.rules, and the difference matters. pulse.rules are
# matched against the client properties at context create, so they can only
# ever see what a client sets on its context, and libcanberra puts these values
# on the stream, which is the only place it has for them. stream.rules are
# matched against the stream's own properties at stream creation, before the
# node is exported, so the claim is on the node from the first moment it
# exists -- which is what the mixer needs, it reads the claim when it builds
# its port table, before the first buffer, so the hardware raise leads the
# sound instead of chasing it.

stream.rules = [
    {
        matches = [
            { media.name = "Battery Notification" }
        ]
        actions = {
            update-props = {
                x-maemo.volume.absolute = "1"
            }
        }
    },
    {
        matches = [
            { "module-stream-restore.id" = "x-maemo-system-sound" }
        ]
        actions = {
            update-props = {
                media.role = "x-maemo-system-sound"
                x-maemo.volume.absolute = "1"
            }
        }
    },
]
