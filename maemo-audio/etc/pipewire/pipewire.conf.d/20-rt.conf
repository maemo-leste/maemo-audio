# Use RTKit instead of the XDG desktop portal for realtime scheduling.
#
# xdg-desktop-portal's Realtime backend validates every promotion by reading the
# caller's PID namespace (/proc/<pid>/ns/pid). On this kernel that lookup fails:
#
#   MakeThreadRealtimeWithPID -> "Could not get pidns for pid N:
#                               Could not fstatat ns/pid: Not a directory"
#
# Because the portal owns the name org.freedesktop.portal.Desktop, module-rt
# prefers it and never falls through to RTKit. Result: every pipewire thread
# stays SCHED_OTHER, which is what makes the ALSA sink underrun at quanta
# below 4096 despite the CPU being nearly idle.
#
# RTKit performs no namespace check and answers fine here (MaxRealtimePriority
# = 20), so skipping the portal is enough.
#
# This section is merged into libpipewire-module-rt's existing args by
# pw_context_conf_update_props() in module-rt.c, so rt.prio and nice.level
# from the main pipewire.conf are preserved. RTKit clamps 88 down to its
# configured maximum of 20, which is still real-time and ample for audio.

module.rt.args = {
    rtportal.enabled = false
}
