# Redirect SPA factory names to the Maemo flat-volume library.
#
# pw_context_load_spa_handle() consults pw_context_find_spa_lib() BEFORE
# the library.name that setup_mixer() passes, so a matching entry here
# overrides the stock "audiomixer/libspa-audiomixer" fallback.
#
# IMPORTANT: every entry must live in a SINGLE context.spa-libs block.
# Two separate blocks in the same fragment do not accumulate -- the later
# one replaces the earlier. Verify with
#   grep "map factory regex" pipewire.log
# and confirm every expected line is present.
#
# The ALSA sink negotiates audio/x-dsp (F32P mono per channel) on its
# link-facing ports, so setup_mixer() picks audio.mixer.dsp there.
#
# The virtual sink is created by name rather than by the core's mixer
# redirect, so it needs its own entry: pw_context_load_spa_handle() has
# no fallback library when the caller is not setup_mixer().
#
# Remove this file to revert to stock mixing instantly.
context.spa-libs = {
    ^audio.mixer.dsp$ = maemo-flat-volume/libspa-maemo-flat-volume
    audio.maemo.mixer = maemo-flat-volume/libspa-maemo-flat-volume
}
