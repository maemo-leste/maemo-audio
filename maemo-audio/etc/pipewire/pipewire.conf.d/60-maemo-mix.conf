# The Maemo volume mechanism.
#
# The mixer mixes; this module turns the user's slider into a hardware
# level:
#
#   applet writes x-maemo.volume.target (0..65536, cubic in amplitude)
#     -> amplitude
#     -> rung of the device's ladder
#     -> the hardware step that carries that rung
#     -> that step's amplitude, written to the ALSA route
#
# The mixer's own software gain stays at unity, so the loudness the user
# sets is the loudness the amplifier produces, with nothing multiplied in
# software on the way.
#
# Why this is a module in the daemon and not a WirePlumber policy
# --------------------------------------------------------------
# Three things have to agree at one moment: the level, the route it is
# written to, and the node the applet reads the level back from. A policy
# script sees a proxy of each, each updated on its own schedule, and has
# no way to tell whether the write it just made is the one the reader is
# about to see. In-process all three are the same objects.
#
# What it listens for
# -------------------
#   x-maemo-mix / x-maemo.route    the routing script's announcement:
#                                  sink, device, devidx, route index.
#                                  Nothing about level.
#   the applet's own metadata      x-maemo.volume.target, read where
#                                  the applet already writes it.
#   node properties                x-maemo.volume.tuning and
#                                  .tuning.incall, the ladders, and the
#                                  level published back for the applet
#                                  to display.
#
# It owns the "x-maemo-mix" namespace rather than listening on
# "default": adding an implementation listener to that object corrupts
# the daemon. The applet's object is bound, not owned.

context.modules = [
  { name = libpipewire-module-maemo-mix
    args = {
      # The virtual sink: our mixer node. Streams are aimed at it by the
      # routing script rather than by this node winning the default-sink
      # election, so default.audio.sink stays a truthful statement of the
      # physical device WirePlumber resolved.
      #
      # Requires 55-spalib-redirect.conf so the same library also serves
      # as the core's per-link mix handle; without it the stock audiomixer
      # does the mixing and this node's level is not on the path.
      vsink.enable = 1
      vsink.name = maemo_mixer
      tuning.default = "-4000,-3800,-3600,-3400,-3200,-3000,-2800,-2600,-2400,-2200,-2000,-1600,-1400,-1200,-1000,-800,-600,-400,-200,0"
      tuning.default.incall = "-2000,-1600,-1400,-1200,-1000,-800,-600,-400,-200,0"

      # Codec write margins, microseconds: raise late, lower early, so the
      # residual between the software duck and the hardware step lands on the
      # quiet side. The deadline itself is the mixer's -- now + clock.delay,
      # taken in the cycle whose samples the duck is applied to -- and these
      # are offsets on top of it, one per edge.
      #
      # Convention inherited from the reference: "raise late, lower early",
      # so a positive lower margin releases earlier and a negative one later.
      #
      # 5/5 was fitted by ear on the VM, with both edges moved together, so
      # neither value is individually attributed: 5/0 and 0/5 each left an
      # audible bump on one edge, 5/5 does not. The VM's main-loop timer tail
      # is 4-9 ms and hypervisor-mediated, so on a device with working RTKit
      # and a different codec these may be wrong in the other direction.
      # Re-measure there before defending them -- see docs/timing.md.
      maemo.raise-margin-usec = 5000
      maemo.lower-margin-usec = 5000
    }
  }
]

# The generic fallback ladders, in centibels, live in the module args
# above.
#
# A per-device rule (monitor.alsa.rules / monitor.bluez.rules) gives real
# hardware its own curve. These are what a sink gets when no rule has
# given it one.
#
# Why module args and not a monitor's rules, nor a top-level config
# section
# ---------------------------------------------------------------
# Rules are per-monitor. A filler written in monitor.alsa.rules never
# reaches a Bluetooth sink, and can never reach a sink a module created
# directly (filter-chain, null-sink). Covering every sink from the
# monitor side means one copy of the curve per monitor, and still has
# holes.
#
# A top-level section in a conf.d fragment does not work either:
# conf.c add_override() stores fragment keys namespaced as
# "override.<level>.<index>.<key>", so pw_context_get_conf_section() only
# sees the MAIN pipewire.conf's sections. Module args arrive through
# module_init intact, which is the same path that delivers vsink.enable.
#
# The module writes these onto the sink node when it has no ladder of its
# own. Written onto the node rather than kept private to the module
# because the applet also reads the ladder from the sink node. A fallback
# only the module knew about would leave the slider and the level drawn
# from different tables -- the drift this arrangement exists to prevent.
#
# Values are the N900 internal-speaker ladders from community-ssu/
# pulseaudio-nokia, src/common/data/ihf.parameters: the same generic
# default the applet carried before this existed. A sane fallback, not a
# claim about the hardware in hand.
