# Delayed route writer for the Maemo volume model.
#
# The maemo-volume WirePlumber policy decides what level the hardware should
# carry, but it cannot time the write.  A route write lands in the codec
# immediately, while the stream-side gain compensation that must accompany
# it is still travelling through the client ring and the graph.  The
# mismatch is what makes music swell under a key-press click.
#
# This module takes over execution of the route write.  It reads the live
# ALSA ring fill from /proc, arms a timer on the context data loop for that
# long, and performs pw_impl_device_set_param(Route, ...) in the graph
# driver thread -- so the level changes as the uncompensated samples in the
# ring drain out, rather than on top of them.
#
# The card and substream to read the fill from are taken from the ALSA
# device itself, so nothing here is device-specific.  The two knobs below
# are the only tuning values, and they mirror Nokia's PulseAudio defaults:
#
#   extra.ms    slack added on top of the measured fill
#   margin.ms   direction-aware bias: going up we land late (a brief dip
#               beats a swell), going down we land early.  Never louder
#               than what was asked for.
#
# The policy hands work to us through the "x-maemo-volume" metadata
# namespace, which this module owns.  It deliberately does not listen on
# the "default" namespace: adding an implementation listener to that
# object corrupts the daemon.

context.modules = [
  { name = libpipewire-module-maemo-volume
    args = {
      extra.ms  = 5
      margin.ms = 5
    }
  }
]
