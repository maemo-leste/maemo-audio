# maemo-statusmenu-volume tuning ladders -- Motorola Droid 4 (cpcap)
#
# Installed by maemo-audio-droid4 to /etc/wireplumber/wireplumber.conf.d/.
# The device is in the filename because that directory is shared with the
# other maemo-audio-<device> packages.
#
# The applet picks one ladder per sink:
#
#   ladder = call_active ? x-maemo.volume.tuning.incall : x-maemo.volume.tuning
#
# call_active means a sink input with media.role phone or Communication is
# running.  Every sink declares both properties.
#
# Ladders are per output port, not per card: the ports are not acoustically
# equivalent and are not even the same node, the jack changes the UCM
# profile and replaces the speaker sink with the headphone one.
#
# FORMAT: gains in centibel, ascending, one entry per hardware position.
# The applet converts them with pa_sw_volume_from_dB(), PulseAudio's cubic
# curve, so regenerate rather than hand-compute:
#
#   gen-tuning-table.py --ctrl-min N --ctrl-max M --tlv-max 12 --steps S
#
# The cpcap HiFi control is TLV -33..+12 dB in 3 dB steps, ctrl 0..15, and
# PipeWire maps PA_VOLUME_NORM onto the TLV maximum, so
#
#   cB = (hardware_dB - 12) * 100        ctrl 11 = 0 dB = base_volume 41350
#
# DOTS IN THE MATCH PATTERNS MUST STAY UNESCAPED.  These files are SPA-JSON,
# where "\." is an invalid escape: the file is rejected outright and every
# rule in it is silently absent, leaving all sinks on the applet's built-in
# N900 ladder.

monitor.alsa.rules = [

  # Internal speaker, HiFi verb, ctrl 0..11 -> -33..0 dB.  ctrl 12..15
  # (+3..+12 dB) are left off, the slider stops at unity gain.
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200"
        x-maemo.volume.tuning.incall = "-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200"
      }
    }
  },

  # Headphones and headset, HiFi verb, ctrl 0..9 -> -33..-6 dB.  UCM opens
  # this path at ctrl 4 where the speaker sits at 7, three positions is
  # 9 dB, so both ladders are the speaker's shifted down by that.  The
  # speaker's headroom through a headphone driver is a hearing hazard.
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800"
        x-maemo.volume.tuning.incall = "-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200,-900"
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.HiFi__Headset__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800"
        x-maemo.volume.tuning.incall = "-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200,-900"
      }
    }
  },

  # Circuit-switched call node, Voice Call verb (Handset, Speakerphone,
  # Earbuds), ctrl 6..15 -> -15..+12 dB.  Both properties carry the same
  # ladder: the modem drives the codec directly, there is no host stream, so
  # call_active is never set on this node.
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.Voice_Call__.*__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
        x-maemo.volume.tuning.incall = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
        # Absolute playback raises the pre-mix HiFi control rather than the
        # post-mix Voice control this route carries: the Voice one holds the
        # call level and moving it moves the far end of the call.  11 is
        # 0 dB, the top the speaker ladder allows.
        x-maemo.volume.abs-element = "HiFi,0"
        x-maemo.volume.abs-value   = "11"
      }
    }
  },

  # Bluetooth: no local TLV, the node reports base volume 65536 / 0 dB, so
  # tlv_max is 0 and the centibel figures are plain dB.  The N900 tables
  # apply unchanged, the amplification lives in the remote device and is
  # driven by the BT absolute-volume path.
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4000,-3800,-3600,-3400,-3200,-3000,-2800,-2600,-2400,-2200,-2000,-1800,-1600,-1400,-1200,-1000,-800,-600,-400,-200,0"
        x-maemo.volume.tuning.incall = "-2000,-1800,-1600,-1400,-1200,-1000,-800,-600,-400,-200,0"
      }
    }
  },

  # HDMI is intentionally absent: volume is downstream of the display and
  # nobody has measured it, so the applet warns once and uses the built-in
  # N900 ladder for that card.

]
