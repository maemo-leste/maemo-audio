# maemo-statusmenu-volume tuning ladders -- Motorola Droid 4 (cpcap)
#
# Installed to /etc/wireplumber/wireplumber.conf.d/ by maemo-audio-droid4.
# The device is in the filename because that directory is shared: it keeps
# this file unambiguous once other maemo-audio-<device> packages land there.
#
# The applet picks one ladder per sink:
#
#     ladder = call_active ? x-maemo.volume.tuning.incall
#                         : x-maemo.volume.tuning
#
# where call_active means "at least one sink input carries media.role of
# phone or Communication" (matched case-insensitively).  Every sink
# declares BOTH properties.
#
# Ladders are per OUTPUT PORT, not per card, because the ports are not
# acoustically equivalent and are not even the same node: plugging the
# jack changes the UCM profile and destroys the speaker sink, replacing
# it with alsa_output.platform-soundcard.HiFi__Headphones__sink.  A
# single HiFi__.*__sink rule would hand the speaker's ceiling to
# headphones, which are far more efficient per dB of codec gain.
#
# FORMAT
#
# Comma separated gain values in centibel, ascending.  Converted by the
# applet with pa_sw_volume_from_dB(), which is PulseAudio's CUBIC
# perceptual curve (dB = 60*log10(v/NORM)), NOT the electrical
# 20*log10.  Regenerate rather than hand-computing:
#
#     gen-tuning-table.py --ctrl-min N --ctrl-max M --tlv-max 12 --steps S
#
# DERIVATION (verified against measured base_volume, zero delta)
#
#     base_volume = pa_sw_volume_from_dB(-tlv_max)
#     cB          = (hardware_dB - tlv_max) * 100
#
# PipeWire maps PA_VOLUME_NORM onto the declared control's TLV maximum,
# so for cpcap (TLV -33..+12 dB, 3 dB/step) base_volume 41350 sits at
# hardware 0 dB, which is ctrl 11.
#
# The headphone offset comes from UCM itself, not from measurement: the
# HiFi verb enables the speaker at "HiFi Playback Volume 7" and the
# headphones at 4.  Three control positions = 9 dB.  That offset is
# applied to both headphone ladders below.  Adjust by ear if 9 dB is the
# wrong compensation for a given handset.
#
# DO NOT ESCAPE DOTS IN THE MATCH PATTERNS
#
# These files are parsed as SPA-JSON, where a backslash inside a quoted
# string is an escape character and "\." is not a valid one.  A file
# containing node.name = "~alsa_output\.platform-soundcard\...." is
# rejected outright with
#
#     wp_conf_open: failed to open '...': section 'monitor.alsa.rules' has no value
#
# and every rule in it is silently absent -- all sinks then fall back to
# the applet's built-in N900 ladder.  Leave the dots bare.

monitor.alsa.rules = [

  # ------------------------------------------------------------------
  # Internal speaker -- HiFi verb, ctrl 0..12.
  #
  #   ctrl  0 -> -33 dB   ctrl  5 -> -18 dB   ctrl 10 ->  -3 dB
  #   ctrl  1 -> -30 dB   ctrl  6 -> -15 dB   ctrl 11 ->   0 dB  <- base_volume
  #   ctrl  2 -> -27 dB   ctrl  7 -> -12 dB   ctrl 12 ->  +3 dB  <- the one boost
  #   ctrl  3 -> -24 dB   ctrl  8 ->  -9 dB
  #   ctrl  4 -> -21 dB   ctrl  9 ->  -6 dB
  #
  # 13 steps: every hardware position up to unity gain, plus one step of
  # boost.  One entry per hardware position, so no slider position is
  # ever dead.
  #
  # Fremantle's 20 logical steps are not available here: the control has
  # only 16 positions, so a 20-entry table would collapse four pairs of
  # slider positions onto the same hardware level and the slider would
  # feel dead for those steps.
  #
  # ctrl 13..15 (+6, +9, +12 dB) are deliberately left off, so the
  # slider tops out at +3 dB of boost instead of the +12 dB the codec
  # can be pushed to.  The top ladder entry is therefore -900 cB rather
  # than 0: slider maximum is 46396, not PA_VOLUME_NORM (65536).
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200,-900"
        x-maemo.volume.tuning.incall = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
      }
    }
  },

  # ------------------------------------------------------------------
  # Headphones / 4-pole headset -- HiFi verb, ctrl 0..9.
  #
  # Same codec control as the speaker, but the ladder is shifted down by
  # the 9 dB that UCM itself uses when it enables this port at ctrl 4
  # instead of 7:
  #
  #   ctrl 0 -> -33 dB ... ctrl 9 -> -6 dB
  #
  # 10 steps, top -6 dB hardware, i.e. 9 dB below the speaker's +3 dB
  # ceiling.  Reaching the speaker's full boost through a headphone driver
  # is a hearing hazard, so the headroom is trimmed here rather than left
  # to the user to avoid.
  #
  # In-call ladder is the call ladder shifted by the same 9 dB
  # (ctrl 3..12, top +3 dB hardware), so VOIP on headphones sits 9 dB
  # under VOIP on the speaker just as the media paths do.
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800"
        x-maemo.volume.tuning.incall = "-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200,-900"
      }
    }
  },

  # ------------------------------------------------------------------
  # Circuit-switched call node (Voice Call verb: Earpiece, Speaker,
  # Headset routes).
  #
  # Top 10 hardware positions, ctrl 6..15 -> hardware -15 dB .. +12 dB:
  #
  #   slider 0.1 -> -15 dB -> ctrl  6      slider 0.6 ->  0 dB -> ctrl 11
  #   slider 0.2 -> -12 dB -> ctrl  7      slider 0.7 -> +3 dB -> ctrl 12
  #   slider 0.3 ->  -9 dB -> ctrl  8      slider 0.8 -> +6 dB -> ctrl 13
  #   slider 0.4 ->  -6 dB -> ctrl  9      slider 0.9 -> +9 dB -> ctrl 14
  #   slider 0.5 ->  -3 dB -> ctrl 10      slider 1.0 -> +12 dB -> ctrl 15
  #
  # Same ladder in both properties: this node only ever carries the call
  # path.  A circuit-switched call has no host stream at all -- the modem
  # drives the codec directly through the UCM Voice Call verb -- so
  # call_active is never set on this node and the applet reads the normal
  # property while that call runs.
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.Voice_Call__.*__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
        x-maemo.volume.tuning.incall = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
      }
    }
  },

  # ------------------------------------------------------------------
  # Bluetooth (bluez_output.*).
  #
  # A different device entirely: no cpcap control, no local TLV.  The
  # node reports Base Volume 65536 / 0.00 dB, i.e. PA_VOLUME_NORM is
  # already the ceiling and there is no hardware headroom to ladder
  # against.  Amplification lives in the remote device and is driven by
  # the BT absolute-volume path.
  #
  # With tlv_max = 0 the cB values are just the dB figures themselves, so
  # these are ordinary perceptual ladders and the N900 tables apply
  # unchanged: -40..0 dB over 21 entries for media, -20..0 dB over 11
  # entries in call.
  #
  # Matching every bluez output rather than a specific address so all
  # paired devices share one rule.  A handset with a much hotter or much
  # quieter amp than average may want its own override.
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4000,-3800,-3600,-3400,-3200,-3000,-2800,-2600,-2400,-2200,-2000,-1800,-1600,-1400,-1200,-1000,-800,-600,-400,-200,0"
        x-maemo.volume.tuning.incall = "-2000,-1800,-1600,-1400,-1200,-1000,-800,-600,-400,-200,0"
      }
    }
  },

  # ------------------------------------------------------------------
  # HDMI (platform-omap-hdmi-audio) is intentionally absent: volume is
  # downstream of the display and there is no local TLV to ladder
  # against.  Until someone measures it the applet warns once and uses the
  # built-in N900 ladder for that card.
  # ------------------------------------------------------------------

]
